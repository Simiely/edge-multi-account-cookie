<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Cookie Switcher</title>
<style>
:root {
  --bg: #1B1A1E;
  --surface: #242227;
  --surface-2: #2E2C32;
  --surface-hover: #2E2C32;
  --primary: #FF9292;
  --primary-hover: #E87373;
  --primary-text: #3D1F1F;
  --primary-200: #FFB4B4;
  --primary-100: #FFD9D9;
  --danger: #F09595;
  --success: #5DCAA5;
  --warning: #FAC775;
  --text: #E8E4E1;
  --text-2: #C9C5CE;
  --text-3: #9C97A3;
  --border: #3A383F;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 320px; min-height: 420px; overflow-x: hidden;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 13px;
}

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }
.header-title { font-size: 13px; font-weight: 500; color: var(--text); }
.header-status { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.header-status.gray { background: var(--border); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn { background: none; border: none; color: var(--text-3); cursor: pointer; padding: 4px; border-radius: 6px; display: flex; }
.icon-btn:hover { color: var(--text); background: var(--surface-2); }

/* Identity anchor */
.identity { padding: 14px 14px 12px; text-align: center; border-bottom: 0.5px solid var(--border); }
.identity-avatar {
  width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 8px;
  background: var(--primary); color: var(--primary-text);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 500;
}
.identity-domain { font-size: 13px; font-weight: 500; color: var(--text); word-break: break-all; }
.identity-sub { font-size: 11px; color: var(--primary-200); margin-top: 2px; }

/* Account list */
.list-wrap { padding: 10px 14px; }
.list-title { font-size: 10px; font-weight: 500; color: var(--text-3); margin-bottom: 6px; letter-spacing: 0.4px; }
.account-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
.account-list::-webkit-scrollbar { width: 4px; }
.account-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.account-card {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px;
  background: var(--surface); border: 1px solid transparent; border-radius: var(--radius);
  cursor: pointer; transition: all 0.15s;
}
.account-card:hover { background: var(--surface-2); }
.account-card:active { transform: scale(0.98); }
.account-card.active { border-color: var(--primary); }
.account-card .avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500;
}
.account-card .info { flex: 1; min-width: 0; }
.account-card .info .name { font-size: 12px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.health-badge {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin-left: 6px; vertical-align: middle; flex-shrink: 0;
}
.health-badge.ok { background: var(--success); box-shadow: 0 0 4px rgba(93,202,165,0.5); }
.health-badge.expired { background: var(--danger); box-shadow: 0 0 4px rgba(240,149,149,0.5); }
.account-card .info .group-tag { font-size: 10px; color: var(--text-3); margin-top: 1px; }
.account-card .actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
.account-card:hover .actions { opacity: 1; }
.account-card .actions button {
  background: none; border: none; cursor: pointer; font-size: 12px;
  padding: 3px 5px; border-radius: 6px; color: var(--text-3);
}
.account-card .actions .btn-edit:hover { color: var(--success); background: rgba(93,202,165,0.15); }
.account-card .actions .btn-switch-icon:hover { color: var(--primary); background: rgba(255,146,146,0.15); }
.account-card .actions .btn-delete:hover { color: var(--danger); background: rgba(240,149,149,0.15); }

.group-header { font-size: 11px; color: var(--text-3); padding: 6px 4px 2px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.group-header .group-toggle { font-size: 10px; }

.empty-state { text-align: center; padding: 20px 12px; color: var(--text-3); }
.empty-state .icon { font-size: 32px; margin-bottom: 6px; opacity: 0.7; }
.empty-state .text { font-size: 12px; }

/* Status */
.status-bar { display: none; padding: 8px 10px; margin: 0 14px 8px; border-radius: var(--radius); font-size: 11px; line-height: 1.5; }
.status-bar.show { display: block; }
.status-bar.success { background: rgba(93,202,165,0.12); color: var(--success); border: 0.5px solid rgba(93,202,165,0.3); }
.status-bar.error { background: rgba(240,149,149,0.12); color: var(--danger); border: 0.5px solid rgba(240,149,149,0.3); }
.status-bar.warning { background: rgba(250,199,117,0.12); color: var(--warning); border: 0.5px solid rgba(250,199,117,0.3); }

/* Grant banner */
#grantBanner { margin: 0 14px 8px; padding: 10px; background: rgba(255,146,146,0.10); border: 0.5px solid rgba(232,115,115,0.4); border-radius: var(--radius); font-size: 12px; color: var(--text-2); }
#grantBanner .grant-btn {
  display: inline-block; margin-top: 8px; padding: 6px 14px; border: none; border-radius: 6px;
  background: var(--primary); color: var(--primary-text); cursor: pointer; font-size: 12px; font-weight: 500;
}

/* Action area */
.action-area { padding: 8px 14px 12px; border-top: 0.5px solid var(--border); }
.btn-login {
  width: 100%; padding: 10px; border: 1px solid var(--primary-hover); border-radius: var(--radius);
  background: rgba(255,146,146,0.10); color: var(--primary-200);
  font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s;
}
.btn-login:hover { background: rgba(255,146,146,0.18); }
.btn-login:active { transform: scale(0.98); }
.btn-login:disabled { opacity: 0.5; cursor: default; }

.icon-bar { display: flex; justify-content: space-around; align-items: center; margin-top: 10px; }
.icon-bar .ib-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px 10px; border-radius: 8px; }
.icon-bar .ib-item:hover { background: var(--surface-2); }
.icon-bar .ib-item svg { display: block; }
.icon-bar .ib-item span { font-size: 10px; color: var(--text-3); }
.icon-bar .ib-item.primary svg { stroke: var(--primary); }

/* Lock overlay */
#lockOverlay {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 12px;
}
#lockOverlay.show { display: flex; }
#lockOverlay .lock-icon { font-size: 30px; }
#lockOverlay .lock-title { font-size: 14px; font-weight: 500; color: var(--text); }
#lockOverlay input {
  width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none; text-align: center;
}
#lockOverlay input:focus { border-color: var(--primary); }
#lockOverlay .btn-unlock {
  width: 100%; padding: 10px; border: none; border-radius: var(--radius); cursor: pointer;
  background: var(--primary); color: var(--primary-text); font-size: 13px; font-weight: 500;
}
#lockOverlay .btn-unlock:hover { background: var(--primary-hover); }
#lockOverlay .lock-msg { font-size: 12px; color: var(--text-3); min-height: 16px; text-align: center; }
#lockOverlay .lock-msg.error { color: var(--danger); }
</style>
</head>
<body>

<!-- Lock overlay -->
<div id="lockOverlay">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">已开启密码锁</div>
  <input type="password" id="lockInput" placeholder="输入密码解锁" autocomplete="off" />
  <button class="btn-unlock" id="btnUnlock">解锁</button>
  <div class="lock-msg" id="lockMsg"></div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-title">Cookie Switcher</div>
  <div class="header-actions">
    <span class="header-status" id="permStatus" title="站点权限"></span>
    <button class="icon-btn" id="btnOptions" title="设置" aria-label="设置">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 3.5 V5 M8 11 V12.5 M3.5 8 H5 M11 8 H12.5 M4.8 4.8 L5.8 5.8 M10.2 10.2 L11.2 11.2" stroke="currentColor" stroke-width="1"/></svg>
    </button>
  </div>
</div>

<!-- Identity anchor -->
<div class="identity" id="identityBlock">
  <div class="identity-avatar" id="identityAvatar">?</div>
  <div class="identity-domain" id="domainText">正在获取...</div>
  <div class="identity-sub" id="identitySub"></div>
</div>

<!-- Status -->
<div class="status-bar" id="statusBar"></div>

<!-- Grant banner -->
<div id="grantBanner" style="display:none;"></div>

<!-- Account list -->
<div class="list-wrap">
  <div class="list-title" id="sectionTitle">已保存的账号</div>
  <div class="account-list" id="accountList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="icon">📂</div>
    <div class="text">还没有保存的账号</div>
  </div>
</div>

<!-- Action area -->
<div class="action-area">
  <button class="btn-login" id="btnLoginNew">登录新账号（清除当前 Cookie）</button>
  <div class="icon-bar">
    <div class="ib-item primary" id="btnSave" title="保存当前账号" role="button" tabindex="0">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 11 L3 13 L13 13 L13 11 M8 3 L8 10 M5 7 L8 10 L11 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>保存</span>
    </div>
    <div class="ib-item" id="btnWebdavPush" title="上传备份到 WebDAV" role="button" tabindex="0">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 11 L8 3 M5 6 L8 3 L11 6 M3 13 L13 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>上传</span>
    </div>
    <div class="ib-item" id="btnWebdavPull" title="从 WebDAV 下载恢复" role="button" tabindex="0">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 5 L8 13 M5 10 L8 13 L11 10 M3 3 L13 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>下载</span>
    </div>
    <div class="ib-item" id="btnRefresh" title="刷新当前站点" role="button" tabindex="0">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 8 a5 5 0 1 1 -1.5 -3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M13 2.5 V5 H10.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>刷新</span>
    </div>
  </div>
</div>

<!-- Save panel (collapsible, hidden by default) -->
<div id="savePanel" style="display:none;padding:0 14px 12px;">
  <input type="text" id="inputName" placeholder="账号名称（如：工作号）" maxlength="30" style="width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;margin-bottom:6px;"/>
  <input type="text" id="inputGroup" placeholder="分组（可选，如：工作/个人）" maxlength="20" style="width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;"/>
</div>

<script src="lib/crypto.js"></script>
<script src="lib/storage.js"></script>
<script src="lib/cookies.js"></script>
<script src="lib/health.js"></script>
<script src="lib/security.js"></script>
<script src="lib/messaging.js"></script>
<script src="ui/popup-render.js"></script>
<script src="ui/popup-ui.js"></script>
<script src="popup.js"></script>
</body>
</html>
